name: Actualizar Dashboard

on:
  schedule:
    - cron: '0 8 */3 * *'  # cada 3 dias a las 8am UTC
  workflow_dispatch:        # permite correrlo manualmente tambien

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Generar dashboard
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python generate_dashboard.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Dashboard actualizado $(date +'%d %b %Y')"
          git push
